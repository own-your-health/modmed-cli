# cargo-deny configuration. Run: cargo deny check
[advisories]
yanked = "deny"

[licenses]
# Permissive licenses we accept for dependencies, and AGPL-3.0-only for this
# crate and medical-common's. ModMed's Certified API Terms of Use (3.6) bar
# code under a license that requires ModMed's code, or code combined with
# theirs, to be disclosed; AGPL-3.0's terms cover only this program's code.
# No other copyleft, MPL-2.0 included.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-only",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The family's shared crates (pk-cli-*, pk-med-*) are consumed as tag-pinned
# git dependencies.
allow-git = [
    "https://github.com/piekstra/cli-common",
    "https://github.com/own-your-health/medical-common",
]
