[package]
name = "modmed-cli"
description = "Pull your own health records from a ModMed practice through ModMed's Certified (ONC) FHIR API. Unofficial; not affiliated with or endorsed by ModMed (Modernizing Medicine, Inc.)."
version = "0.1.0"
edition = "2021"
# pk-cli-auth's refresh lock (File::lock) needs 1.89.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/modmed-cli"
authors = ["piekstra"]
keywords = ["fhir", "smart-on-fhir", "modmed", "us-core", "health-records"]
categories = ["command-line-utilities"]
publish = false

[lib]
name = "modmed"
path = "src/lib.rs"

[[bin]]
name = "modmed"
path = "src/main.rs"

[dependencies]
# Every pk-cli-* on the cli-common tag medical-common pins (its DESIGN.md §3):
# two tags in one build are two copies of every pk-cli-core type.
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2", features = ["reqwest"] }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
# A profile's kept Chrome profile, removed with the profile.
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
# documents/v1: the DTOs, `verify_download`, safe file names.
pk-cli-documents = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2" }
pk-med-records = { git = "https://github.com/piekstra/medical-common", tag = "v0.6.2" }
pk-med-fhir = { git = "https://github.com/piekstra/medical-common", tag = "v0.6.2" }
# `browser`: the sign-in window in the profile's own Chrome profile.
pk-med-smart = { git = "https://github.com/piekstra/medical-common", tag = "v0.6.2", features = ["browser"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
url = "2"
# An attachment's inline `data`.
base64 = "0.22"
# A long document id's file name keeps a hash of the whole id.
sha2 = "0.11"

[dev-dependencies]
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.33.2", features = ["test-util"] }
pk-med-fhir = { git = "https://github.com/piekstra/medical-common", tag = "v0.6.2", features = ["test-util"] }
pk-med-records = { git = "https://github.com/piekstra/medical-common", tag = "v0.6.2", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
